[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eecc"
dynamic = ["version"]
description = "Exciton-Exciton Coupling Calculator: excitonic couplings from TD-DFT, transition-density cubes or transition charges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "S. Rasoul Hashemi" },
]
requires-python = ">=3.10"
keywords = [
    "exciton coupling", "TDDFT", "transition density", "TrESP", "diabatization",
    "Huang-Rhys", "PySCF", "computational chemistry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]
qm = ["pyscf>=2.8", "pyscf-dispersion>=1.3", "geometric>=1.1", "pyyaml>=5.4"]

[project.urls]
Homepage = "https://github.com/srhashemi/EECC"
Source = "https://github.com/srhashemi/EECC"
Issues = "https://github.com/srhashemi/EECC/issues"
Changelog = "https://github.com/srhashemi/EECC/blob/main/CHANGELOG.md"
Article = "https://doi.org/10.1039/d6cs00157b"

[project.scripts]
eecc = "eecc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "eecc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
