name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # the coupling methods, cube and charge I/O, and the diabatic.json format (no quantum-chemistry packages)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev,viz]" pyyaml
      - name: Test
        run: python -m pytest -q tests

  core-os:
    # the same on Windows and macOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ".[dev,viz]" pyyaml
      - name: Test
        run: python -m pytest -q tests

  package:
    # the sdist and wheel build, their metadata (README renders on PyPI), and the installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel and run the sdist's tests against it
        run: |
          python -m pip install "$(ls dist/*.whl)[dev,viz]" pyyaml
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          eecc --version
          python -c "import eecc, importlib.metadata as m; assert 'site-packages' in eecc.__file__, eecc.__file__; assert m.version('eecc') == eecc.__version__"
          python -m pytest -q tests

  qm:
    # the automated pipeline (eecc run) on small molecules with PySCF
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[dev,viz,qm]"
      - name: Test
        run: python -m pytest -q tests

  qm-os:
    # the pipeline natively on Windows and macOS (Apple silicon): pip has no pyscf-dispersion there,
    # so "eecc[qm]" installs without it and the tests of the D3 optimization are skipped
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[dev,viz,qm]"
      - name: Test
        run: python -m pytest -q -rs tests
